modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/CptGummiball/grandmas-cookie/issues"

[[mods]]
modId = "oma_core"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
displayURL = "https://github.com/CptGummiball/grandmas-cookie"
logoFile = "assets/oma_core/textures/gui/credits_logo.png"
description = '''Companion mod of the Grandma's Cookie modpack (Omas Keks): Grandma's house, Grandma herself, the rejoin flow, the cookie handoff and the fair-play guard.'''

[[dependencies.oma_core]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_range}"
ordering = "NONE"
side = "BOTH"

# Grandma is an Easy NPC built from oma_core's preset (ADR-0007); oma_core spawns her via /easy_npc.
[[dependencies.oma_core]]
modId = "easy_npc"
type = "required"
versionRange = "[7.20.0,8)"
ordering = "AFTER"
side = "BOTH"

# Optional: the cookie counts once per FTB team; without FTB Teams each player is their own team.
[[dependencies.oma_core]]
modId = "ftbteams"
type = "optional"
versionRange = "[2101.1.0,2102)"
ordering = "AFTER"
side = "BOTH"

# Optional: Grandma's "recipe book" is FTB Quests' quest book.
[[dependencies.oma_core]]
modId = "ftbquests"
type = "optional"
versionRange = "[2101.1.0,2102)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.oma_core]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
